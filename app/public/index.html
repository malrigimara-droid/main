<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리가메디 발주 산출</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">리가메디 <b>발주 산출</b></div>
  <span class="tag">현재고 업로드 → 안전재고 차이 산출 → 발주서</span>
</header>

<main>
  <section class="card uploadbar">
    <form id="upform">
      <input type="file" id="file" accept=".csv,text/csv">
      <button class="btn primary" type="submit">업로드 → 산출</button>
    </form>
    <a class="btn ghost" href="sample/현재고_샘플.csv" download>샘플 양식</a>
    <a class="btn ghost" href="/api/order.csv">발주서 CSV 내려받기</a>
    <span id="msg" class="msg"></span>
  </section>

  <section class="summary" id="summary"></section>

  <section class="card">
    <table>
      <thead>
        <tr>
          <th class="l">성분 · 상품</th><th>현재고</th>
          <th>안전재고 ✎</th><th>일평균</th><th>ROP</th><th>제안 발주량</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="note">※ 안전재고를 고치면 즉시 저장·재산출됩니다. 같은 성분 두 브랜드(전환·스위칭)는 재고를 합산해 전환 대상 브랜드로 발주합니다.</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
